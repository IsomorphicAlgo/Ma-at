[package]
name = "maat-ground"
description = "Human layer of the Ma'at contact scheduler: OMM/TLE satellites, ground stations, contact windows, an optimal scheduler and explained contact plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["satellite", "scheduling", "ground-station", "contact-plan", "sgp4"]
categories = ["aerospace", "science"]

[features]
# Reading stations and requests from TOML (`maat_ground::scenario`). Off by default.
scenario = ["dep:serde", "dep:toml"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
maat-flight.workspace = true
ephemerust.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde_json.workspace = true
good_lp.workspace = true

[lints]
workspace = true
