# CI for Ma'at: tests on the MSRV and latest stable, lints, docs, the no_std proof for the flight
# crate, and supply-chain gates. Mirrors the Ephemerust / Chronus Gateway pipeline (same 1.89 MSRV).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, so new RustSec advisories against the lockfile surface without a code change.
    - cron: "23 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "1.89" is the MSRV declared in Cargo.toml; "stable" is the newest release.
        toolchain: ["1.89", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo test
        run: cargo test --locked --workspace

  windows:
    # The maintainer develops on Windows; keep the native target green too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --workspace

  no-std:
    # The flight/ground boundary, proven rather than promised: build `maat-flight` for a bare-metal
    # Cortex-M4F target that has no `std` and no allocator. If anything from the human layer (or
    # any `std` use) leaks into the flight crate, this job fails to compile.
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Build maat-flight for bare metal
        run: cargo build --locked -p maat-flight --target thumbv7em-none-eabihf
      - name: Flight crate has no dependencies
        # `cargo tree` prints one line per crate in the graph; the flight crate must be alone.
        run: test "$(cargo tree --locked -p maat-flight --edges normal | wc -l)" -eq 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: cargo audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.6
      - name: cargo deny
        run: cargo deny --all-features check
