[workspace]
# Edition 2024 default: MSRV-aware resolver, so dependency selection respects `rust-version`.
resolver = "3"
members = [
    "crates/maat-flight",
    "crates/maat-ground",
    "crates/maat-cli",
    "crates/maat-wasm",
]

# Shared metadata. Member crates opt in with `field.workspace = true`.
[workspace.package]
# One minor version per completed stage until 1.0 (Methodology D-015): 0.1.0 was Stage 0,
# 0.2.0 Stage 1, 0.4.0 is Stages 2 and 3, built together, 0.5.0 is Stage 4 and 0.6.0 is Stage 5.
# Before 1.0 a minor bump may break the API.
version = "0.6.0"
edition = "2024"
# MSRV: matches Ephemerust and Chronus Gateway. Raising it is a minor-version change.
rust-version = "1.89"
license = "MIT"
authors = ["Michael Hansen"]
repository = "https://github.com/IsomorphicAlgo/Ma-at"

[workspace.dependencies]
# The vehicle layer. `maat-ground` re-exports it as `maat_ground::flight`.
maat-flight = { path = "crates/maat-flight", version = "0.6.0" }
maat-ground = { path = "crates/maat-ground", version = "0.6.0" }

# --- Human layer only. None of these may appear in `maat-flight` (see Methodology D-001). ---

# Astrodynamics backend: OMM/TLE element sets and pass prediction (SGP4 via the `sgp4` crate).
# 1.2 is the floor: it adds OMM input and `Propagator::predict_passes`, which lets one satellite
# be checked against many stations with a single SGP4 initialization (Methodology D-010).
# `default-features = false` skips its CLI (clap/env_logger).
ephemerust = { version = "1.2.1", default-features = false }
# Calendar time at the ground boundary. Ephemerust exposes `chrono` types in its public API.
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"
# JSON output for contact plans. Already in the tree through Ephemerust.
serde_json = "1"
# Reading station and request files: `maat-ground`'s optional `scenario` feature (D-024, D-029).
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# The optimal scheduler's ILP model (Methodology D-017). `microlp` is a pure-Rust solver, so the
# workspace still builds with nothing but a Rust toolchain: no C or C++ compiler, no system
# libraries. The default features would pull in a C solver instead.
good_lp = { version = "1.15", default-features = false, features = ["microlp"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
